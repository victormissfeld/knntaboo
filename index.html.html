<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>KNN Taboo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>

/* ── RESET ────────────────────────────────────────────── */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* ── ROOT VARS ───────────────────────────────────────── */
:root {
  --purple:   #6B1FAD;
  --magenta:  #E01A85;
  --dark:     #1a0a2e;
  --radius:   20px;
  --safe-b:   env(safe-area-inset-bottom, 0px);
}

/* ── BASE ────────────────────────────────────────────── */
html {
  height: 100%;
  background: #6B1FAD;
}

body {
  min-height: 100%;
  font-family: 'Barlow', sans-serif;
  background: linear-gradient(160deg, #6B1FAD 0%, #9B2FD4 35%, #D4186E 70%, #F72585 100%);
  background-attachment: fixed;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: calc(32px + var(--safe-b));
}

/* ── HEADER ──────────────────────────────────────────── */
.header {
  width: 100%;
  max-width: 520px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 20px 0;
}

.logo {
  display: flex;
  flex-direction: column;
  line-height: 1;
}
.logo-knn {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 30px;
  color: #fff;
  letter-spacing: -1px;
}
.logo-sub {
  font-size: 9px;
  font-weight: 600;
  color: rgba(255,255,255,0.6);
  letter-spacing: 3px;
  text-transform: uppercase;
}

.header-title {
  text-align: right;
}
.header-title-main {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 22px;
  color: #fff;
  text-transform: uppercase;
  letter-spacing: 1px;
  line-height: 1;
}
.header-title-sub {
  font-size: 10px;
  font-weight: 500;
  color: rgba(255,255,255,0.55);
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

/* ── PROGRESS ────────────────────────────────────────── */
.progress-wrap {
  width: 100%;
  max-width: 520px;
  padding: 16px 20px 0;
}
.progress-track {
  width: 100%;
  height: 5px;
  background: rgba(255,255,255,0.2);
  border-radius: 99px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: rgba(255,255,255,0.85);
  border-radius: 99px;
  transition: width 0.5s ease;
  width: 100%;
}
.progress-label {
  margin-top: 6px;
  font-size: 11px;
  font-weight: 600;
  color: rgba(255,255,255,0.55);
  letter-spacing: 1px;
  text-transform: uppercase;
  text-align: right;
}

/* ── CARD AREA ───────────────────────────────────────── */
.card-area {
  width: 100%;
  max-width: 520px;
  padding: 16px 20px 0;
}

/* ── WELCOME SCREEN ──────────────────────────────────── */
.welcome {
  background: rgba(255,255,255,0.1);
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: var(--radius);
  padding: 48px 28px;
  text-align: center;
  color: #fff;
}
.welcome-icon {
  font-size: 60px;
  display: block;
  margin-bottom: 16px;
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-8px); }
}
.welcome h2 {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 34px;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.welcome p {
  font-size: 15px;
  line-height: 1.6;
  color: rgba(255,255,255,0.7);
}

/* ── THE CARD ────────────────────────────────────────── */
.card {
  background: #fff;
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: 0 16px 48px rgba(0,0,0,0.3);
  animation: cardIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes cardIn {
  from { transform: scale(0.88) translateY(16px); opacity: 0; }
  to   { transform: scale(1) translateY(0); opacity: 1; }
}

.card-top {
  background: linear-gradient(135deg, var(--purple), var(--magenta));
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-cat {
  font-size: 11px;
  font-weight: 600;
  color: rgba(255,255,255,0.85);
  text-transform: uppercase;
  letter-spacing: 2.5px;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.25);
  padding: 4px 12px;
  border-radius: 99px;
}
.card-num {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 14px;
  color: rgba(255,255,255,0.45);
}

.card-target {
  padding: 24px 20px 18px;
  text-align: center;
  border-bottom: 2px solid #f3e8ff;
}
.card-target-lbl {
  font-size: 10px;
  font-weight: 700;
  color: var(--magenta);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.card-target-word {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: clamp(52px, 13vw, 80px);
  color: var(--dark);
  text-transform: uppercase;
  line-height: 1;
  letter-spacing: -1px;
}
.card-translation {
  margin-top: 10px;
  padding: 8px 16px;
  background: rgba(107,31,173,0.07);
  border-radius: 10px;
  display: none;
}
.card-translation.show { display: block; }
.card-translation-lbl {
  font-size: 9px;
  font-weight: 700;
  color: var(--magenta);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.card-translation-word {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 26px;
  color: var(--purple);
}

.card-taboo {
  padding: 16px 20px 22px;
  background: #faf4ff;
}
.card-taboo-lbl {
  font-size: 10px;
  font-weight: 700;
  color: var(--magenta);
  letter-spacing: 3px;
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 12px;
}
.taboo-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.taboo-list li {
  background: #fff;
  border: 1.5px solid #e4c9ff;
  border-radius: 10px;
  padding: 10px 16px;
  font-weight: 700;
  font-size: 17px;
  color: #5a1090;
  text-align: center;
}
.taboo-list li::before {
  content: '🚫 ';
  font-size: 12px;
}

/* ── HIDDEN OVERLAY ──────────────────────────────────── */
.card-hidden {
  background: linear-gradient(135deg, #3a0a6e, #8a1a6e);
  border-radius: var(--radius);
  padding: 64px 28px;
  text-align: center;
  color: #fff;
  cursor: pointer;
}
.card-hidden-icon { font-size: 48px; display: block; margin-bottom: 12px; }
.card-hidden h3 {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 24px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.card-hidden p { font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 4px; }

/* ── EMPTY ───────────────────────────────────────────── */
.empty {
  background: rgba(255,255,255,0.1);
  border: 2px dashed rgba(255,255,255,0.3);
  border-radius: var(--radius);
  padding: 48px 28px;
  text-align: center;
  color: #fff;
}
.empty-icon { font-size: 52px; display: block; margin-bottom: 14px; }
.empty h3 {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 28px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.empty p { font-size: 14px; color: rgba(255,255,255,0.65); }

/* ── BUTTONS ─────────────────────────────────────────── */
.controls {
  width: 100%;
  max-width: 520px;
  padding: 16px 20px 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* Base button — iOS Safari safe */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  border: none;
  border-radius: 14px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 20px;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 18px 20px;
  cursor: pointer;
  /* iOS Safari critical */
  -webkit-appearance: none;
  appearance: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  /* no transform on disabled, no stacking weirdness */
  position: static;
}
.btn:disabled {
  opacity: 0.35;
  cursor: default;
}
.btn:active:not(:disabled) {
  filter: brightness(0.92);
}

.btn-draw {
  background: #fff;
  color: var(--purple);
  box-shadow: 0 8px 28px rgba(0,0,0,0.2);
  font-size: 22px;
  padding: 20px;
}

.btn-row {
  display: flex;
  gap: 10px;
}
.btn-row .btn { flex: 1; font-size: 16px; padding: 15px 10px; }

.btn-ghost {
  background: rgba(255,255,255,0.12);
  color: #fff;
  border: 1.5px solid rgba(255,255,255,0.25);
}

.btn-trans {
  background: rgba(255,255,255,0.07);
  color: rgba(255,255,255,0.7);
  border: 1.5px dashed rgba(255,255,255,0.22);
  font-family: 'Barlow', sans-serif;
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 1px;
  padding: 12px 20px;
}

.btn-muted {
  background: rgba(0,0,0,0.15);
  color: rgba(255,255,255,0.6);
  border: 1px solid rgba(255,255,255,0.12);
  font-size: 15px;
}

/* ── HISTORY ─────────────────────────────────────────── */
.history-wrap {
  width: 100%;
  max-width: 520px;
  padding: 4px 20px 0;
}
.history-toggle {
  width: 100%;
  background: none;
  border: none;
  -webkit-appearance: none;
  appearance: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  cursor: pointer;
  color: rgba(255,255,255,0.45);
  font-family: 'Barlow', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 12px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.history-pills {
  display: none;
  flex-wrap: wrap;
  gap: 6px;
  padding-bottom: 8px;
}
.history-pills.open { display: flex; }
.pill {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 99px;
  padding: 5px 13px;
  font-size: 12px;
  font-weight: 600;
  color: rgba(255,255,255,0.7);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* ── PROJECTION MODE ─────────────────────────────────── */
body.proj .header,
body.proj .progress-wrap,
body.proj .btn-row,
body.proj .btn-trans,
body.proj .btn-muted,
body.proj .history-wrap { display: none; }

body.proj .controls { padding-top: 20px; }

.exit-proj {
  display: none;
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 999;
  background: rgba(20,5,40,0.7);
  border: 1.5px solid rgba(255,255,255,0.2);
  border-radius: 99px;
  color: rgba(255,255,255,0.5);
  font-family: 'Barlow', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 10px 18px;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
body.proj .exit-proj { display: block; }

/* ── TOAST ───────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: calc(28px + var(--safe-b));
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: rgba(15,4,30,0.92);
  color: #fff;
  font-family: 'Barlow', sans-serif;
  font-size: 14px;
  font-weight: 600;
  padding: 12px 24px;
  border-radius: 99px;
  border: 1px solid rgba(255,255,255,0.15);
  white-space: nowrap;
  pointer-events: none;
  transition: transform 0.3s ease;
  z-index: 9999;
}
.toast.show { transform: translateX(-50%) translateY(0); }

</style>
</head>

<!-- HEADER -->

  <div class="logo">
    <span class="logo-knn">KNN</span>
    <span class="logo-sub">Idiomas</span>
  </div>

</div>

</div>

<!-- CARD -->
<div class="card-area" id="cardArea"></div>

<!-- CONTROLS -->
<div class="controls">
  <button type="button" class="btn btn-draw" id="btnDraw">▶ Draw Card</button>

  <div class="btn-row">
    <button type="button" class="btn btn-ghost" id="btnHide" disabled>👁 Hide</button>
    <button type="button" class="btn btn-ghost" id="btnCopy" disabled>📋 Copy</button>
  </div>

  <button type="button" class="btn btn-trans" id="btnTrans" disabled>🇧🇷 Show Translation</button>

  <div class="btn-row">
    <button type="button" class="btn btn-muted" id="btnReset">🔄 Reset</button>
    <button type="button" class="btn btn-muted" id="btnProj">📽 Projection</button>
  </div>
</div>

<!-- HISTORY -->
<div class="history-wrap">
  <button type="button" class="history-toggle" id="btnHistory">📜 Used cards ▾</button>
  <div class="history-pills" id="historyPills"></div>
</div>

<!-- EXIT PROJECTION -->
<button type="button" class="exit-proj" id="btnExitProj">✕ Exit</button>

<!-- TOAST -->
<div class="toast" id="toast"></div>

/* ── STATE ─────────────────────────────────────────────────────────────────── */
let deck    = [];
let used    = [];
let current = null;
let hidden  = false;
let showTr  = false;
let histOpen= false;
let projMode= false;
const TOTAL = DECK.length;

/* ── ELEMENTS ──────────────────────────────────────────────────────────────── */
const cardArea     = document.getElementById('cardArea');
const progressFill = document.getElementById('progressFill');
const progressLbl  = document.getElementById('progressLabel');
const btnDraw      = document.getElementById('btnDraw');
const btnHide      = document.getElementById('btnHide');
const btnCopy      = document.getElementById('btnCopy');
const btnTrans     = document.getElementById('btnTrans');
const btnReset     = document.getElementById('btnReset');
const btnProj      = document.getElementById('btnProj');
const btnHistory   = document.getElementById('btnHistory');
const historyPills = document.getElementById('historyPills');
const btnExitProj  = document.getElementById('btnExitProj');
const toastEl      = document.getElementById('toast');

/* ── WIRE EVENTS (no inline onclick — safer on iOS Safari) ─────────────────── */
btnDraw.addEventListener('click', onDraw);
btnHide.addEventListener('click', onHide);
btnCopy.addEventListener('click', onCopy);
btnTrans.addEventListener('click', onTrans);
btnReset.addEventListener('click', onReset);
btnProj.addEventListener('click', onProj);
btnHistory.addEventListener('click', onHistory);
btnExitProj.addEventListener('click', onProj);

/* ── INIT ──────────────────────────────────────────────────────────────────── */
function init() {
  deck    = shuffle([...DECK]);
  used    = [];
  current = null;
  hidden  = false;
  showTr  = false;
  histOpen= false;

  updateProgress();
  renderWelcome();

  btnDraw.disabled  = false;
  btnDraw.textContent = '▶ Draw Card';
  btnHide.disabled  = true;
  btnCopy.disabled  = true;
  btnTrans.disabled = true;
  btnHide.textContent  = '👁 Hide';
  btnTrans.textContent = '🇧🇷 Show Translation';

  historyPills.innerHTML = '';
  historyPills.classList.remove('open');
  histOpen = false;
}

/* ── DRAW ──────────────────────────────────────────────────────────────────── */
function onDraw() {
  if (!deck.length) return;
  current = deck.pop();
  used.push(current);
  hidden = false;
  showTr = false;

  updateProgress();
  renderCard();
  addPill(current.word);

  btnHide.disabled  = false;
  btnCopy.disabled  = false;
  btnTrans.disabled = false;
  btnHide.textContent  = '👁 Hide';
  btnTrans.textContent = '🇧🇷 Show Translation';

  if (!deck.length) {
    btnDraw.disabled = true;
    btnDraw.textContent = '🎉 All Done!';
  }
}

/* ── HIDE ──────────────────────────────────────────────────────────────────── */
function onHide() {
  if (!current) return;
  hidden = !hidden;
  renderCard();
  btnHide.textContent = hidden ? '👁 Reveal' : '👁 Hide';
}

/* ── TRANSLATION ───────────────────────────────────────────────────────────── */
function onTrans() {
  if (!current) return;
  showTr = !showTr;
  const trBlock = document.getElementById('trBlock');
  if (trBlock) trBlock.classList.toggle('show', showTr);
  btnTrans.textContent = showTr ? '🇧🇷 Hide Translation' : '🇧🇷 Show Translation';
}

/* ── COPY ──────────────────────────────────────────────────────────────────── */
function onCopy() {
  if (!current) return;
  const txt = `🎯 ${current.word}\n🚫 ${current.taboo.join(', ')}\n📁 ${current.cat}`;
  navigator.clipboard && navigator.clipboard.writeText(txt)
    .then(() => toast('✅ Copied!'))
    .catch(() => toast('Copy not available'));
}

/* ── RESET ─────────────────────────────────────────────────────────────────── */
function onReset() {
  init();
  toast('🔄 Deck reset — 100 cards ready!');
}

/* ── PROJECTION ────────────────────────────────────────────────────────────── */
function onProj() {
  projMode = !projMode;
  document.body.classList.toggle('proj', projMode);
  toast(projMode ? '📽 Projection ON' : '🖥 Normal mode');
}

/* ── HISTORY ───────────────────────────────────────────────────────────────── */
function onHistory() {
  histOpen = !histOpen;
  historyPills.classList.toggle('open', histOpen);
  btnHistory.textContent = histOpen ? '📜 Used cards ▴' : '📜 Used cards ▾';
}

function addPill(word) {
  const p = document.createElement('div');
  p.className = 'pill';
  p.textContent = word;
  historyPills.insertBefore(p, historyPills.firstChild);
}

/* ── RENDER ────────────────────────────────────────────────────────────────── */
function renderWelcome() {
  cardArea.innerHTML = `
    <div class="welcome">
      <span class="welcome-icon">🃏</span>
      <h2>Ready to Play?</h2>
      <p>Draw the first card and describe the word without saying any of the taboo words!</p>
    </div>`;
}

function renderCard() {
  if (hidden) {
    cardArea.innerHTML = `
      <div class="card-hidden" id="hiddenTap">
        <span class="card-hidden-icon">🤫</span>
        <h3>Card Hidden</h3>
        <p>Tap to reveal</p>
      </div>`;
    document.getElementById('hiddenTap').addEventListener('click', function() {
      hidden = false;
      btnHide.textContent = '👁 Hide';
      renderCard();
    });
    return;
  }

  const c = current;
  const num = String(TOTAL - deck.length).padStart(3,'0');
  const tabooRows = c.taboo.map(w => `<li>${w}</li>`).join('');

  cardArea.innerHTML = `
    <div class="card">
      <div class="card-top">
        <span class="card-cat">${c.cat}</span>
        <span class="card-num">#${num}</span>
      </div>
      <div class="card-target">
        <div class="card-target-lbl">Describe this word</div>
        <div class="card-target-word">${c.word}</div>
        <div class="card-translation${showTr ? ' show' : ''}" id="trBlock">
          <div class="card-translation-lbl">🇧🇷 Tradução</div>
          <div class="card-translation-word">${c.tr}</div>
        </div>
      </div>
      <div class="card-taboo">
        <div class="card-taboo-lbl">🚫 Taboo Words</div>
        <ul class="taboo-list">${tabooRows}</ul>
      </div>
    </div>`;
}

function renderEmpty() {
  cardArea.innerHTML = `
    <div class="empty">
      <span class="empty-icon">🎉</span>
      <h3>All cards used!</h3>
      <p>Click Reset to start again.</p>
    </div>`;
}

/* ── HELPERS ───────────────────────────────────────────────────────────────── */
function updateProgress() {
  const pct = (deck.length / TOTAL) * 100;
  progressFill.style.width = pct + '%';
  progressLbl.textContent = deck.length === 0
    ? 'All cards used!'
    : `${deck.length} card${deck.length === 1 ? '' : 's'} remaining`;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

let toastTimer;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

/* ── START ─────────────────────────────────────────────────────────────────── */
init();
</script>
